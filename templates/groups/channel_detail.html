{% extends "base.html" %}
{% block title %}
	<title>{{ channel.title }}</title>
{% endblock %}
{% block content %}
	<div class="container">
        <h2>{{ channel.title }}</h2>
        <h5>{{ channel.description }}</h5>
        <h3>Viewers</h3>
        {% for viewer in viewers %}
        <p>{{ viewer.user.username }}</p>
        {% endfor %}
    </div>
{% endblock %}
