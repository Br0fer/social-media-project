{% extends "base.html" %}
{% block title %}
    <title>Channels List</title>
{% endblock %}
{% block content %}
    <div class="container">
        {% for channel in channels %}
            <div class="card" style="width: 18rem;">
                <div class="card-body">
                    <h5 class="card-title">{{ channel.title }}</h5>
                    <p class="card-text">{{ channel.description }}</p>
                    <a href="#" class="btn btn-primary ">Check Out</a>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
