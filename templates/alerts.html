{% if messages %}
  <div class="toasts" role="region" aria-label="Notifications">
    {% for message in messages %}
      <div class="toast {{ message.tags|default:'info' }}" role="{% if message.level_tag == 'error' or message.level_tag == 'warning' %}alert{% else %}status{% endif %}" data-toast>
        <span class="toast-icon" aria-hidden="true">
          {% if message.level_tag == 'success' %}<i class="bi bi-check-lg"></i>
          {% elif message.level_tag == 'error' %}<i class="bi bi-exclamation-lg"></i>
          {% elif message.level_tag == 'warning' %}<i class="bi bi-exclamation-triangle"></i>
          {% else %}<i class="bi bi-info-lg"></i>{% endif %}
        </span>
        <p>{{ message }}</p>
        <button type="button" data-toast-close aria-label="Dismiss notification"><i class="bi bi-x-lg" aria-hidden="true"></i></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
