{% comment %}Person card. Expects `profile`.{% endcomment %}
<div class="person space-person">
  {% include "partials/avatar.html" with p=profile %}
  <div>
    <h2><a href="{% url 'profile:profile-detailed' pk=profile.pk %}">{{ profile.username|default:"New member" }}</a></h2>
    {% if profile.status %}<p>{{ profile.status }}</p>{% endif %}
  </div>
</div>
