{% extends "base.html" %}
{% block title %}
	<title>Posts List</title>
{% endblock %}

{% block content %}
	<div class="container">
        <div class="row">
            <div class="col-2"></div>
            <div class="col-8">
                {% for post in posts %}
                    <a href="{% url "posts:post-detailed" post.pk %}">
                        <div class="card m-3" style="width: 50rem;">
                          <img src="{{ post.image.url }}" class="card-img-top" alt="..." href="">
                          <div class="card-body">
                            <h3 class="card-title">{{ post.title }}</h3>
                          </div>
                        </div>
                    </a>
                
                {% endfor %}
            </div>
            <div class="col-2"></div>

        </div>
    </div>
{% endblock %}
