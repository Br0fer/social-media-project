{% extends "base.html" %}
{% block title %}
	<title>Posts List</title>
{% endblock %}

{% block content %}
	<div class="container align-content-center">
    {% for post in posts %}
        <div class="card m-3" style="width: 50rem;">
          <img src="{{ post.image.url }}" class="card-img-top" alt="..." href="">
          <div class="card-body">
            <h3 class="card-title">{{ post.title }}</h3>
          </div>
        </div>
    {% endfor %}
    </div>
{% endblock %}
